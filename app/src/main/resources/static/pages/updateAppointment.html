<!-- updateAppointment.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Appointment - Smart Clinic</title>
  <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
  <link rel="stylesheet" href="/assets/css/updateAppointment.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/js/util.js" defer></script>
  <script src="/js/render.js" defer></script>
  <script src="/js/components/header.js" defer></script>
  <script src="/js/components/footer.js" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>

      <div class="main-content">
        <div class="form-container">
          <h2>Reschedule Appointment</h2>
          <label for="appointmentDate">New date</label>
          <input type="date" id="appointmentDate" class="date-picker">
          <label for="appointmentTime">Available time</label>
          <select id="appointmentTime" class="select-dropdown"></select>
          <div class="card-actions">
            <button id="updateAppointmentBtn" class="btn-primary">Update</button>
            <a href="/pages/patientAppointments.html" class="btn-secondary">Cancel</a>
          </div>
        </div>
      </div>

      <div id="footer"></div>
    </div>
  </div>

  <script type="module" src="/js/updateAppointment.js" defer></script>
</body>
</html>
