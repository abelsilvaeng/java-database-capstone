<!-- addPrescription.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Prescription - Smart Clinic</title>
  <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
  <link rel="stylesheet" href="/assets/css/addPrescription.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/js/util.js" defer></script>
  <script src="/js/render.js" defer></script>
  <script src="/js/components/header.js" defer></script>
  <script src="/js/components/footer.js" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>

      <div class="main-content">
        <div class="form-container">
          <h2>Add Prescription</h2>
          <input type="text" id="patientName" class="input-field" placeholder="Patient name" readonly>
          <input type="text" id="medicines" class="input-field" placeholder="Medication">
          <input type="text" id="dosage" class="input-field" placeholder="Dosage (e.g. 500mg)">
          <textarea id="notes" class="input-field" placeholder="Doctor notes (max 200 characters)" maxlength="200"></textarea>
          <div class="card-actions">
            <button id="savePrescription" class="btn-primary">Save</button>
            <button id="cancelPrescription" class="btn-secondary">Cancel</button>
          </div>
        </div>
      </div>

      <div id="footer"></div>
    </div>
  </div>

  <script type="module" src="/js/addPrescription.js" defer></script>
</body>
</html>
