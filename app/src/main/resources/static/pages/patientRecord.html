<!-- patientRecord.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Record - Smart Clinic</title>
  <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
  <link rel="stylesheet" href="/assets/css/patientDashboard.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/js/util.js" defer></script>
  <script src="/js/render.js" defer></script>
  <script src="/js/components/header.js" defer></script>
  <script src="/js/components/footer.js" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>

      <div class="main-content">
        <h2>Medical record for <span id="patientName"></span></h2>

        <table class="table-header">
          <thead>
            <tr>
              <th>Appointment</th>
              <th>Date</th>
              <th>Time</th>
              <th>Doctor</th>
              <th>Medication</th>
              <th>Dosage</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table>
      </div>

      <div id="footer"></div>
    </div>
  </div>

  <script type="module" src="/js/patientRecordServices.js" defer></script>
</body>
</html>
