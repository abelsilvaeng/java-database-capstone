<!-- patientAppointments.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments - Smart Clinic</title>
  <link rel="icon" type="image/png" href="/assets/images/logo/logo.png">
  <link rel="stylesheet" href="/assets/css/patientDashboard.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/js/util.js" defer></script>
  <script src="/js/render.js" defer></script>
  <script src="/js/components/header.js" defer></script>
  <script src="/js/components/footer.js" defer></script>
</head>
<body onload="renderContent()">
  <div class="container">
    <div class="wrapper">
      <div id="header"></div>

      <div class="main-content">
        <div class="filter-wrapper">
          <input type="text" id="searchBar" class="searchBar" placeholder="Filter by doctor name">
          <select id="filterCondition" class="filter-select">
            <option value="">All appointments</option>
            <option value="future">Upcoming</option>
            <option value="past">Past</option>
          </select>
          <a href="/pages/patientRecord.html" class="dashboard-btn">My Record</a>
        </div>

        <table class="table-header">
          <thead>
            <tr>
              <th>ID</th>
              <th>Doctor</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table>
      </div>

      <div id="footer"></div>
    </div>
  </div>

  <script type="module" src="/js/patientAppointment.js" defer></script>
</body>
</html>
