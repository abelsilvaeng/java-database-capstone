# =====================================================================
# Smart Clinic Management System - application configuration
#
# Both datastores are configured below: MySQL for the relational core
# (patient, doctor, appointment, admin) and MongoDB for prescriptions.
#
# Connection details are read from the environment so that no credential
# is ever committed. Each property falls back to a local default, so the
# application also runs with no environment set at all.
#
# In the Skills Network Cloud IDE, export the values from the MySQL and
# MongoDB tool panels before starting the app:
#
#   export MYSQL_HOST=<mysql_host> MYSQL_PORT=3306 MYSQL_DB=cms
#   export MYSQL_USER=root MYSQL_PASSWORD=<mysql_password>
#   export MONGO_URI="mongodb://root:<mongo_password>@<mongo_host>:27017/prescriptions?authSource=admin"
#
# The authSource=admin segment is required: the root user lives in the
# admin database, not in prescriptions.
# =====================================================================

spring.application.name=back-end

# -------------------------
# MySQL (structured data)
#
# preserveInstants=false stops Connector/J from shifting DATETIME values between
# the connection time zone and the JVM's. appointment_time is a wall-clock value
# mapped to LocalDateTime, so 09:00 in the table must come back as 09:00 in the
# API. With the previous serverTimezone=UTC the driver re-interpreted stored
# times as UTC and rendered them in local time, shifting every appointment.
# Values come from the environment so the same image runs locally and in Docker.
# -------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cms}?useSSL=false&allowPublicKeyRetrieval=true&preserveInstants=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------
# MongoDB (prescriptions)
# -------------------------
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/prescriptions}

# -------------------------
# Health
# -------------------------
management.endpoint.health.show-details=always
management.health.db.enabled=true

# -------------------------
# Application
# -------------------------
api.path=/
jwt.secret=${JWT_SECRET:2f7b1d9c4a6e8035bd12ce47a09f6381d5c2be74a9130fe6852c47db903a1f6c}

spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
