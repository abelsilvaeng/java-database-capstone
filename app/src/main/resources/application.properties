spring.application.name=back-end

# -------------------------
# MySQL (structured data)
# Values come from the environment so the same image runs locally and in Docker.
# -------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:cms}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------
# MongoDB (prescriptions)
# -------------------------
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/prescriptions}

# -------------------------
# Health
# -------------------------
management.endpoint.health.show-details=always
management.health.db.enabled=true

# -------------------------
# Application
# -------------------------
api.path=/
jwt.secret=${JWT_SECRET:2f7b1d9c4a6e8035bd12ce47a09f6381d5c2be74a9130fe6852c47db903a1f6c}

spring.web.resources.static-locations=classpath:/static/

# -------------------------
# Thymeleaf
# -------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
