name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    # The context-load test needs both databases, so CI runs them as services
    # instead of mocking the infrastructure away.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cms
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_DB: cms
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MONGO_URI: mongodb://127.0.0.1:27017/prescriptions
      JWT_SECRET: ci-only-secret-2f7b1d9c4a6e8035bd12ce47a09f6381d5c2be74a9130fe6852c47db903a1f6c

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Load schema, sample data and stored procedures
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < SQL/cms.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < SQL/insert-sample-data.sql
          mysql -h 127.0.0.1 -P 3306 -uroot -proot < SQL/stored-procedures.sql

      - name: Verify the stored procedures run
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot cms \
            -e "CALL get_monthly_appointment_report_by_doctor(NULL);"

      # The runner image already ships Maven. Prefer it over the wrapper so the build
      # does not depend on downloading a Maven distribution on every run.
      - name: Build and run tests
        working-directory: app
        run: |
          if command -v mvn >/dev/null 2>&1; then
            mvn -B verify
          else
            ./mvnw -B verify
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the application image
        run: docker build -t smartclinic-app:${{ github.sha }} ./app

      - name: Confirm the image starts
        run: docker run --rm --entrypoint java smartclinic-app:${{ github.sha }} -version
